name: build-and-load

on:
  push:
    branches: [main]
    # Only what changes a module.  A change to the load test alone is run
    # by hand against an earlier build (build_run_id).
    paths: ['build.sh', 'patches/**', 'tools/port.py', 'tools/kpatchify.py',
            'tools/klp-overlay*', 'tools/klp-overlay/**', 'tools/klpsymcheck.py']
  workflow_dispatch:
    inputs:
      kernels:
        description: 'minors / kernel versions separated by commas, each optionally prefixed with "almalinux:" or "rocky:" (e.g. rocky:10.2,9.0); "all" is over 256 kernels and refused'
        default: 'rocky:10.2'
      build_run_id:
        description: load-test the modules of this earlier run instead of building
        required: false
        default: ''
      from_release:
        description: apply with the README's curl | bash command instead
        type: boolean
        default: false
      old_ref:
        description: branch of the earlier CVE-2026-99999 repositories whose livepatch.sh must refuse
        default: main

permissions:
  actions: read
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ inputs.kernels }}
  cancel-in-progress: true

jobs:
  # Which kernels: on a push, those the change can affect
  # (tools/select-kernels.py); by hand, a list.  GitHub allows at most 256
  # jobs per matrix, so large sets are dispatched per minor.
  matrix:
    runs-on: ubuntu-latest
    outputs:
      include: ${{ steps.m.outputs.include }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: m
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          KERNELS: ${{ inputs.kernels }}
        run: |
          if [ "$EVENT" = push ]; then
            if git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
              changed=$(git diff --name-only "$BEFORE" "$GITHUB_SHA")
            else
              changed=build.sh
            fi
            include=$(python3 -I tools/select-kernels.py changed $changed)
          else
            include=$(python3 -I tools/select-kernels.py "$KERNELS")
          fi
          n=$(python3 -I -c 'import json,sys; print(len(json.loads(sys.argv[1])))' "$include")
          [ "$n" -le 256 ] || { echo "$n kernels; dispatch per minor (at most 256 per run)"; exit 1; }
          echo "include=$include" | tee -a "$GITHUB_OUTPUT"

  build:
    needs: matrix
    if: ${{ needs.matrix.outputs.include != '[]' && !inputs.build_run_id && !inputs.from_release }}
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.matrix.outputs.include) }}
    name: build ${{ matrix.distro }} ${{ matrix.minor }} (${{ matrix.nvr }})
    steps:
      - uses: actions/checkout@v4
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache /usr/local/share/boost /usr/share/swift
          sudo docker image prune -af
          df -h /
      - uses: actions/cache/restore@v4
        with:
          path: .ccache
          key: ccache-${{ matrix.distro }}-${{ matrix.nvr }}-${{ github.run_id }}
          restore-keys: ccache-${{ matrix.distro }}-${{ matrix.nvr }}-
      - name: build
        env:
          DISTRO: ${{ matrix.distro }}
          MINOR: ${{ matrix.minor }}
          NVR: ${{ matrix.nvr }}
          SRPM: ${{ matrix.srpm }}
        run: |
          mkdir -p out .ccache
          case $DISTRO in
          almalinux) image=almalinux:${MINOR%%.*} ;;
          rocky) image=rockylinux/rockylinux:${MINOR%%.*} ;;
          esac
          docker run --rm -v "$PWD:/w" "$image" \
            /w/build.sh "$DISTRO" "$MINOR" "$NVR" "$SRPM"
      - if: always()
        run: sudo chown -R "$(id -u):$(id -g)" .ccache
      - if: always() && matrix.ga
        uses: actions/cache/save@v4
        with:
          path: .ccache
          key: ccache-${{ matrix.distro }}-${{ matrix.nvr }}-${{ github.run_id }}
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kpatch-${{ matrix.distro }}-${{ matrix.nvr }}
          path: out/

  loadtest:
    needs: [matrix, build]
    if: ${{ !cancelled() && needs.matrix.outputs.include != '[]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.matrix.outputs.include) }}
    name: loadtest ${{ matrix.distro }} ${{ matrix.minor }} (${{ matrix.nvr }})
    steps:
      - uses: actions/checkout@v4
      - if: ${{ !inputs.from_release }}
        uses: actions/download-artifact@v4
        with:
          name: kpatch-${{ matrix.distro }}-${{ matrix.nvr }}
          path: built
          run-id: ${{ inputs.build_run_id || github.run_id }}
          github-token: ${{ github.token }}
      - id: week
        env:
          MINOR: ${{ matrix.minor }}
        run: |
          echo "week=$(date -u +%G-%V)" >> "$GITHUB_OUTPUT"
          echo "major=${MINOR%%.*}" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: images
          key: images-${{ matrix.distro }}-${{ steps.week.outputs.major }}-${{ steps.week.outputs.week }}
      - name: Install qemu
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q qemu-system-x86 qemu-utils cloud-image-utils >/dev/null
          sudo chmod 666 /dev/kvm
          mkdir -p images
      - name: Load test
        env:
          DISTRO: ${{ matrix.distro }}
          MINOR: ${{ matrix.minor }}
          NVR: ${{ matrix.nvr }}
          FROM_RELEASE: ${{ inputs.from_release && '1' || '' }}
          SCRIPT_REF: ${{ github.ref_name }}
          OLDREF: ${{ inputs.old_ref || 'main' }}
        run: |
          if [ -n "$FROM_RELEASE" ]; then
            # The guest fetches the script and the module from GitHub;
            # this file is only copied over and not loaded.
            mkdir -p built && : > built/unused.ko
          fi
          ko=$(ls built/*.ko 2>/dev/null | head -1)
          [ -n "$ko" ] || { echo "no module was built for $DISTRO $NVR"; exit 1; }
          tools/loadtest.sh "$DISTRO" "$MINOR" "$NVR" "$ko" out
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: loadtest-${{ matrix.distro }}-${{ matrix.nvr }}
          path: out/
